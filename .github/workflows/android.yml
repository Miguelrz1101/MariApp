name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Generar CSS (Tailwind) y fuentes locales
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Ajustes Android (pantalla y voz)
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="windowNoTitle">true</item>#&\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>#' "$STYLES"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n</manifest>#' "$MANIFEST"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />\n</manifest>#' "$MANIFEST"
          cat "$STYLES"
          tail -n 12 "$MANIFEST"

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Aprende-con-Mariangel-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
