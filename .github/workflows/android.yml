name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Nombre MariApp
        run: |
          sed -i 's/"appName": "[^"]*"/"appName": "MariApp"/' capacitor.config.json
          sed -i 's/Aprende con Mariangel/MariApp/g' www/index.html
          grep appName capacitor.config.json

      - name: Instalar dependencias
        run: npm install

      - name: Generar CSS (Tailwind) y fuentes locales
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Ajustes Android (pantalla, voz y huella)
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="windowNoTitle">true</item>#&\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>#' "$STYLES"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n</manifest>#' "$MANIFEST"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />\n</manifest>#' "$MANIFEST"
          cat "$STYLES"
          tail -n 16 "$MANIFEST"

      - name: Crear logo e icono de MariApp
        run: |
          set -e
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          FG=/tmp/fg.png
          convert -size 432x432 xc:none \
            -fill 'rgba(255,255,255,0.20)' -stroke none -draw 'circle 216,216 216,60' \
            -stroke '#D97706' -strokewidth 14 -fill '#FACC15' \
            -draw 'stroke-linejoin round polygon 216,110 244,183 323,187 262,237 282,313 216,270 150,313 170,237 109,187 188,183' \
            -stroke none -fill '#1E293B' -draw 'circle 192,214 192,225' -draw 'circle 240,214 240,225' \
            -fill '#FB7185' -draw 'circle 172,238 172,250' -draw 'circle 260,238 260,250' \
            -fill none -stroke '#1E293B' -strokewidth 9 -draw 'stroke-linecap round path "M 196 240 Q 216 262 236 240"' \
            -stroke none -fill white \
            -draw 'polygon 104,96 111,114 129,121 111,128 104,146 97,128 79,121 97,114' \
            -draw 'polygon 338,300 343,313 356,318 343,323 338,336 333,323 320,318 333,313' \
            $FG
          convert -size 432x432 xc:'#7C3AED' \( $FG -gravity center -crop 330x330+0+0 +repage -resize 432x432 \) -compose over -composite /tmp/leg_base.png
          convert /tmp/leg_base.png \( -size 432x432 xc:none -fill white -draw 'roundrectangle 0,0 431,431 90,90' \) -alpha set -compose DstIn -composite /tmp/legacy.png
          convert /tmp/leg_base.png \( -size 432x432 xc:none -fill white -draw 'circle 216,216 216,0' \) -alpha set -compose DstIn -composite /tmp/round.png
          RES=android/app/src/main/res
          rm -f $RES/mipmap-mdpi/ic_launcher* $RES/mipmap-hdpi/ic_launcher* $RES/mipmap-xhdpi/ic_launcher* $RES/mipmap-xxhdpi/ic_launcher* $RES/mipmap-xxxhdpi/ic_launcher*
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n l f <<< "$d"
            mkdir -p $RES/mipmap-$n
            convert $FG -resize ${f}x${f} $RES/mipmap-$n/mariapp_fg.png
            convert /tmp/legacy.png -resize ${l}x${l} $RES/mipmap-$n/ic_launcher.png
            convert /tmp/round.png -resize ${l}x${l} $RES/mipmap-$n/ic_launcher_round.png
          done
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          cat > $RES/values/mariapp_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="mariapp_bg">#7C3AED</color>
          </resources>
          XML
          for nombre in ic_launcher ic_launcher_round; do
            cat > $RES/mipmap-anydpi-v26/$nombre.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/mariapp_bg"/>
              <foreground android:drawable="@mipmap/mariapp_fg"/>
          </adaptive-icon>
          XML
          done
          ls $RES/mipmap-xxxhdpi $RES/mipmap-anydpi-v26

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MariApp.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MariApp-APK
          path: MariApp.apk
